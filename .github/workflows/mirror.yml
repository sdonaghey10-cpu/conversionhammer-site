name: mirror-old-site
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror original site
        run: |
          B=https://www.conversionhammer.com
          R="--resolve www.conversionhammer.com:443:162.159.143.30"
          mkdir -p old && cd old
          get() { p="/${1#/}"; p="${p%%\?*}"; mkdir -p "$(dirname ".$p")"; curl -fsSL $R "$B$p" -o ".$p" || echo "FAIL $p"; }
          curl -fsSL $R "$B/" -o index.html
          for p in favicon.ico favicon-32.png logo192.png robots.txt sitemap.xml manifest.json; do get $p; done
          for i in 1 2 3 4; do
            grep -rhoE "/?(assets|manus-storage)/[A-Za-z0-9_./%-]+\.[A-Za-z0-9]{2,5}" . 2>/dev/null | sort -u | while read -r p; do
              q="/${p#/}"; [ -f ".$q" ] || get "$q"
            done
          done
          find . -type f | sort > ../old-files.txt
          wc -l ../old-files.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add old old-files.txt
          git commit -m "Mirror of original site" || echo nothing
          git push
